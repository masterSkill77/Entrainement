services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel_app
    volumes:
      - .:/var/www
    working_dir: /var/www
    networks:
      - laravel

  web:
    image: nginx:alpine
    platform: linux/amd64
    container_name: laravel_nginx
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/public
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel

  mysql:
    image: mysql/mysql-server:5.7
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: log_portiques
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    volumes:
      - ./database/log_portiques.sql:/docker-entrypoint-initdb.d/log_portiques.sql
    ports:
      - "3306:3306"
    networks:
      - laravel

  migrate:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "sleep 10 &&
      php artisan migrate --force &&
      php artisan db:seed"
    volumes:
      - .:/var/www
    networks:
      - laravel

networks:
  laravel:
    driver: bridge
